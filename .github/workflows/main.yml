name: telegram_build
on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: SDK_Toolchain
        run: |
          cd $THEOS
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p sdks
          mv sdks-master/* sdks/
          rm -rf master.zip sdks-master
          
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p toolchain
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C toolchain

      - name: Build Package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH=$THEOS/toolchain/usr/bin:$PATH
          make package FINALPACKAGE=1
