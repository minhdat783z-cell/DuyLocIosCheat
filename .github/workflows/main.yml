name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # Sử dụng bộ toolchain ổn định từ Kaben (thường dùng cho GitHub Actions)
          curl -LO https://github.com/kabiroberon/theos-toolchain-linux/releases/download/v1.0/toolchain-linux-arm64.tar.gz
          sudo mkdir -p $THEOS/toolchain/linux/iphone
          sudo tar -xf toolchain-linux-arm64.tar.gz -C $THEOS/toolchain/linux/iphone
          
          sudo chown -R $USER:$GROUP $THEOS

      - name: Setup SDK
        run: |
          # Tải SDK 14.5
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p /opt/theos/sdks
          mv sdks-master/iPhoneOS14.5.sdk /opt/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          # Lệnh biên dịch chuẩn
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
