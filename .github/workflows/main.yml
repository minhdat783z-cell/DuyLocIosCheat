name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev unzip
          # Sử dụng script cài đặt tự động để tránh lỗi link tải
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Setup SDK 14.5
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          sudo mkdir -p /opt/theos/sdks
          sudo mv sdks-master/iPhoneOS14.5.sdk /opt/theos/sdks/
          sudo rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          # Ép hệ thống dùng trình biên dịch có sẵn
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
