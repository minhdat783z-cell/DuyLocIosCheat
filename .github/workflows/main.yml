name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev
          # Cài đặt vào thư mục mặc định của GitHub runner
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          # Tải Toolchain Linux
          curl -LO https://github.com/theos/toolchain/releases/download/linux-arm64/toolchain-linux-arm64.tar.gz
          mkdir -p $HOME/theos/toolchain
          tar -xf toolchain-linux-arm64.tar.gz -C $HOME/theos/toolchain

      - name: Setup SDK 14.5
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p $HOME/theos/sdks
          mv sdks-master/iPhoneOS14.5.sdk $HOME/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          # Khai báo THEOS trực tiếp trong lệnh build để tránh mất biến môi trường
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
