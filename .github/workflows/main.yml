name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev
          # Cài đặt vào thư mục ngay tại repo để đảm bảo quyền truy cập
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV


      - name: Setup SDK 14.5
        run: |
          # Tải SDK từ kho lưu trữ ổn định
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          sudo mkdir -p /opt/theos/sdks
          sudo mv sdks-master/iPhoneOS14.5.sdk /opt/theos/sdks/
          sudo rm -rf sdks-master master.zip

            - name: Build Tweak
         run: |
          # Không cần export THEOS thủ công vì đã có ở bước trên
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
