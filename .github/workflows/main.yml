name: Build
on:
  push:
    branches: [ "main" ]
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER:$GROUP /opt/theos

            - name: SDK_Toolchain
         run: |
          # Xóa các tệp lỗi cũ nếu có
          rm -rf $THEOS/sdks/*
          
          # Tải SDK iOS chính thức từ kho của Theos (Định dạng .zip ổn định hơn)
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          
          # Di chuyển vào thư mục Theos
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          
          # Tải Toolchain biên dịch (Linux arm64)
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain


      - name: Build Package
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: packages/*.deb
