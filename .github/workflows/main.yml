name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev unzip
          # Cài đặt Theos vào thư mục chuẩn
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup SDK 14.5
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p ~/theos/sdks
          mv sdks-master/iPhoneOS14.5.sdk ~/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Setup Toolchain
        run: |
          curl -LO https://github.com/kabiroberai/theos-toolchain-linux/releases/download/v2.0.0/toolchain-linux-arm64.tar.gz
          mkdir -p ~/theos/toolchain/linux/iphone
          tar -xf toolchain-linux-arm64.tar.gz -C ~/theos/toolchain/linux/iphone --strip-components=1
          rm toolchain-linux-arm64.tar.gz

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          # Kiểm tra file trước khi build để tránh lỗi
          ls -R $THEOS/makefiles
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
