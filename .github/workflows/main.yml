name: Build Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install ldid xz

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Setup iOS Toolchain
        run: |
          export THEOS=~/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk $THEOS/sdks
          rm -rf sdks-master master.zip

      - name: Build Package
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-package
          path: packages/*.deb
      - name: Extract Dylib and Send to Telegram
      if: success()
      run: |
        # 1. Tìm tệp .deb
        DEB_FILE=$(ls packages/*.deb | head -n 1)
        
        # 2. Giải nén lấy .dylib
        mkdir -p extracted
        dpkg-deb -x "$DEB_FILE" extracted/
        DYLIB_PATH=$(find extracted -name "*.dylib" | head -n 1)
        
        # 3. Gửi tệp qua Telegram
        curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
             -F "document=@$DYLIB_PATH" \
             -F "caption=✅ Build thành công! Đây là tệp .dylib của bạn." \
             "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
