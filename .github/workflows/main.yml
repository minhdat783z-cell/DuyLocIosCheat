name: Telegram Build Bot

on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot perl
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: SDK_Toolchain
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Tải SDK iOS từ kho chính thức (Sửa lỗi giải nén từ image_67.png)
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          # Tải Toolchain biên dịch chuyên dụng
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $THEOS/toolchain
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain

      - name: Build Package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Lệnh làm sạch và đóng gói dylib/deb
          make clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLoc-Build
          path: packages/*.deb

      - name: Extract Dylib and Send to Telegram
        if: success()
        run: |
          # 1. Tìm tệp .deb được tạo ra sau bước make package
          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          
          if [ -z "$DEB_FILE" ]; then
            echo "Không tìm thấy file .deb để giải nén!"
            exit 1
          fi

          # 2. Tạo thư mục tạm và giải nén file .deb để lấy nội dung bên trong
          mkdir -p ./temp_extract
          dpkg-deb -x "$DEB_FILE" ./temp_extract
          
          # 3. Tìm sâu vào bên trong các thư mục để tìm tệp .dylib
          DYLIB_PATH=$(find ./temp_extract -name "*.dylib" -type f | head -n 1)
          
          # 4. Gửi trực tiếp tệp .dylib cho bạn qua Bot Telegram
          if [ -f "$DYLIB_PATH" ]; then
            curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F "document=@$DYLIB_PATH" \
                 -F "caption=✅ Đã trích xuất xong file .dylib từ deb và gửi cho bạn!" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
          else
            echo "Lỗi: Không tìm thấy tệp .dylib bên trong gói deb!"
            exit 1
          fi
