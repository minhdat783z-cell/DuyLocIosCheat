name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/setup-theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git

      - name: Setup SDK 14.5
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/iPhoneOS14.5.sdk $THEOS/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
