name: Telegram Build Bot

on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot perl
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: SDK_Toolchain
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Tải SDK iOS chính thức để tránh lỗi định dạng như trong image_67.png
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          # Tải và cài đặt Toolchain biên dịch
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $THEOS/toolchain
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain

      - name: Build Package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Lệnh biên dịch dự án và tạo gói deb
          make clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLoc-Build
          path: packages/*.deb

      - name: Extract Dylib and Send to Telegram
        if: success()
        run: |
          # 1. Tìm tệp .deb được tạo ra
          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          
          if [ -z "$DEB_FILE" ]; then
            echo "Lỗi: Không tìm thấy file .deb để xử lý!"
            exit 1
          fi

          # 2. Tạo thư mục tạm và giải nén toàn bộ cấu trúc file deb
          mkdir -p ./temp_extract
          dpkg-deb -x "$DEB_FILE" ./temp_extract
          
          # 3. Tìm kiếm tệp .dylib (quét tất cả các thư mục con)
          DYLIB_PATH=$(find ./temp_extract -name "*.dylib" -type f | head -n 1)
          
          # 4. Kiểm tra và gửi tệp qua Telegram
          if [ -f "$DYLIB_PATH" ]; then
            curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F "document=@$DYLIB_PATH" \
                 -F "caption=✅ Đã trích xuất thành công dylib từ file deb của bạn!" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
          else
            echo "Lỗi: Build thành công nhưng không tìm thấy file .dylib bên trong deb!"
            # Liệt kê các file để kiểm tra cấu trúc nếu lỗi
            find ./temp_extract
            exit 1
          fi
