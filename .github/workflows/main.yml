name: telegram_build

on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y libfl-dev zstd
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: SDK_Toolchain
        run: |
          # Tải SDK iOS chính thức (Sửa lỗi giải nén từ image_67.png)
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          
          # Tải Toolchain biên dịch
          mkdir -p $THEOS/toolchain
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain

      - name: Build Package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLoc-Build
          path: packages/*.deb

      - name: Extract Dylib and Send to Telegram
        if: success()
        run: |
          # 1. Tìm tệp .deb vừa build xong
          DEB_FILE=$(ls packages/*.deb | head -n 1)
          
          # 2. Giải nén tệp .deb để lấy tệp .dylib (Yêu cầu của bạn)
          mkdir -p extracted
          dpkg-deb -x "$DEB_FILE" extracted/
          DYLIB_FILE=$(find extracted -name "*.dylib" | head -n 1)
          
          # 3. Gửi tệp .dylib trực tiếp qua Telegram (Sử dụng Secret của bạn)
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "document=@$DYLIB_FILE" \
               -F "caption=✅ Build thành công! Đã trích xuất tệp .dylib cho bạn." \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
