name: Telegram Build Bot

on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot perl
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos

      - name: SDK_Toolchain
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $THEOS/toolchain
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain

      - name: Build and Send
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH=$THEOS/bin:$THEOS/toolchain/usr/bin:$PATH
          
          # Biên dịch
          make clean package FINALPACKAGE=1
          
          # Tìm file .deb
          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "Lỗi: Không tìm thấy file .deb!"
            exit 1
          fi

          # Giải nén
          mkdir -p ./temp_extract
          dpkg-deb -x "$DEB_FILE" ./temp_extract
          
          # HIỂN THỊ CẤU TRÚC ĐỂ DEBUG
          echo "--- CẤU TRÚC FILE TRONG DEB ---"
          find ./temp_extract
          echo "-------------------------------"

          # Tìm file .dylib (Không phân biệt hoa thường)
          DYLIB_PATH=$(find ./temp_extract -iname "*.dylib" -type f | head -n 1)

          if [ -n "$DYLIB_PATH" ]; then
            curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F "document=@$DYLIB_PATH" \
                 -F "caption=✅ Gửi file dylib thành công!" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
          else
            echo "Lỗi: Không tìm thấy file .dylib. Hãy xem danh sách file ở trên."
            exit 1
          fi
