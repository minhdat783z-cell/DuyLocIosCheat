name: Telegram Build and Extract
on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: SDK_Toolchain
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          sudo mkdir -p /opt/theos/sdks
          sudo mv sdks-master/* /opt/theos/sdks/

      - name: Build Package
        run: |
          export THEOS=/opt/theos
          make clean package FINALPACKAGE=1

      - name: Extract Dylib and Send to Telegram
        if: success()
        run: |
          # Tìm file .deb
          DEB_FILE=$(ls packages/*.deb | head -n 1)
          # Giải nén để lấy .dylib
          mkdir -p extracted
          dpkg-deb -x "$DEB_FILE" extracted/
          DYLIB_PATH=$(find extracted -name "*.dylib" | head -n 1)
          
          # Gửi file .dylib qua Telegram
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "document=@$DYLIB_PATH" \
               -F "caption=✅ Build thành công! Đây là tệp .dylib của bạn." \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLoc-Full-Build
          path: packages/*.deb
