name: Telegram Build Bot

on:
  repository_dispatch:
    types: [telegram_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: SDK_Toolchain
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Tải SDK iOS
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/* $THEOS/sdks/
          
          # Tải Toolchain biên dịch
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $THEOS/toolchain
          tar -I xz -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain

      - name: Build Package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH=$THEOS/toolchain/usr/bin:$PATH
          make clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: packages/*.deb

      - name: Extract Dylib and Send to Telegram
        if: success()
        run: |
          # Tìm file .deb
          DEB_FILE=$(ls packages/*.deb | head -n 1)
          
          # Giải nén lấy .dylib
          mkdir -p extracted
          dpkg-deb -x "$DEB_FILE" extracted/
          DYLIB_FILE=$(find extracted -name "*.dylib" | head -n 1)
          
          # Gửi file qua Telegram
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "document=@$DYLIB_FILE" \
               -F "caption=✅ Build thành công! Đây là tệp .dylib của bạn." \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
