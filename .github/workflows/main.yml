name: Build DuyLocIosCheat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl git curl libssl-dev ccache
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          # Sử dụng toolchain chính thức của Cabal (ổn định hơn cho Linux)
          curl -LO https://github.com/kabiroberai/theos-toolchain-linux/releases/download/v1.1.0/toolchain-linux-arm64.tar.gz
          sudo tar -xf toolchain-linux-arm64.tar.gz -C $THEOS
          sudo chown -R $USER:$GROUP $THEOS

      - name: Setup SDK
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p /opt/theos/sdks
          mv sdks-master/iPhoneOS14.5.sdk /opt/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          # Ép kiểu build cho kiến trúc 64-bit
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuyLocIosCheat-Output
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
